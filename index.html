<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Known Design</title>
<meta name="description" content="Last Known Design — a practice and a body of work on how AI agents should behave.">
<meta property="og:title" content="lastknown.design">
<meta property="og:description" content="Last Known Design — a practice and a body of work on how AI agents should behave.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://lastknown.design/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cg fill=%22%230073F5%22%3E%3Cpath d=%22M12 83V45a26 26 0 0 1 52 0v38Z%22 /%3E%3C/g%3E
  %3Cg fill=%22%2366AEFF%22%3E%3Crect x=%2246%22 y=%2216%22 width=%2240%22 height=%2249%22 rx=%2219%22 /%3E%3C/g%3E
  %3Cg fill=%22%23FF492C%22%3E%3Ccircle cx=%2273%22 cy=%2273%22 r=%2217%22 /%3E%3C/g%3E%3C/svg%3E">

<style>
  :root {
    --paper:      #faf9f6;
    --ink:        #171614;
    --ink-soft:   #767268;
    --accent:     #8a3324;

    --mark-size:  clamp(84px, 20vw, 128px);

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #131211;
      --ink:      #ece8e0;
      --ink-soft: #8b867c;
      --accent:   #e08b74;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    gap: clamp(1.75rem, 5vw, 2.75rem);
  }

  /* ---------- the mark ---------- */

  /*
    Arch, from the Pebbles agent identity system.

    The three parts drift independently on a slow loop while the whole
    form breathes. Motion, colours and geometry come from the library --
    see pebbles/data.js and pebbles/styles.js.
  */

  .mark {
    width: var(--mark-size);
    height: var(--mark-size);
    margin: 0;
    padding: 0;
    list-style: none;
    display: block;
  }

  .mark svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .mark .part,
  .mark .outer {
    transform-box: view-box;
    transform-origin: center;
  }

  .mark .part.p1 { animation: drift  calc(3.8s / var(--speed, 1)) ease-in-out infinite; }
  .mark .part.p2 { animation: drift2 calc(4.2s / var(--speed, 1)) ease-in-out infinite; }
  .mark .part.p3 { animation: drift3 calc(3.3s / var(--speed, 1)) ease-in-out infinite; }
  .mark .outer   { animation: breath calc(5s   / var(--speed, 1)) ease-in-out infinite; }

  /* The library keeps a dark palette for every colourway. Swap to it
     when the OS is dark, the same way the component does. */
  @media (prefers-color-scheme: dark) {
    .mark .part { fill: var(--dark-fill); }
  }

  @keyframes drift { 0%,100%{transform:translate(0,0)}50%{transform:translate(calc(1.5px * var(--motion-amp, 1)),calc(2px * var(--motion-amp, 1)))} }

  @keyframes drift2 { 0%,100%{transform:translate(0,0)}50%{transform:translate(calc(3px * var(--motion-amp, 1)),calc(-2px * var(--motion-amp, 1)))} }

  @keyframes drift3 { 0%,100%{transform:translate(0,0)}50%{transform:translate(calc(-2px * var(--motion-amp, 1)),calc(2px * var(--motion-amp, 1)))} }

  @keyframes breath { 0%,100%{transform:scale(1)}50%{transform:scale(calc(1 + .035 * var(--motion-amp,1)))} }

  /* ---------- the name ---------- */

  h1 {
    margin: 0;
    font-size: clamp(2.1rem, 1rem + 7vw, 4.6rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.022em;
    text-wrap: balance;
  }
  h1 .tld { color: var(--accent); }

  /* ---------- the standfirst ---------- */

  .standfirst {
    margin: 0;
    max-width: 26rem;
    font-size: clamp(1rem, .95rem + .35vw, 1.125rem);
    line-height: 1.55;
    color: var(--ink-soft);
    text-wrap: balance;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  /* ---------- footer ---------- */

  footer {
    display: flex;
    justify-content: center;
    gap: .35rem 1.4rem;
    flex-wrap: wrap;
    padding: 1.5rem 1.5rem 2.25rem;
    font-family: var(--sans);
    font-size: .8125rem;
    color: var(--ink-soft);
  }
  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 160ms ease, border-color 160ms ease;
  }
  footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  footer .dot { color: var(--ink-soft); opacity: .5; }

  @media (prefers-reduced-motion: reduce) {
    .mark .part, .mark .outer { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<main>

  <div class="mark" role="img" aria-label="Last Known Design">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <g class="outer">
          <g class="part p1" style="fill: #0073F5; --dark-fill: #77B7FF"><path d="M12 83V45a26 26 0 0 1 52 0v38Z" /></g>
          <g class="part p2" style="fill: #66AEFF; --dark-fill: #347BD1"><rect x="46" y="16" width="40" height="49" rx="19" /></g>
          <g class="part p3" style="fill: #FF492C; --dark-fill: #FF806D"><circle cx="73" cy="73" r="17" /></g>
      </g>
    </svg>
  </div>

  <h1>lastknown<span class="tld">.design</span></h1>

  <!--
    No book link here yet. The manuscript is not finished, so the site
    does not advertise it. When the book launches, the door goes back in
    and this comment goes out.
  -->

  <p class="standfirst">
    A practice and a body of work on how AI agents should behave.
  </p>

</main>

<footer>
  <a href="mailto:ian@lastknown.design">ian@lastknown.design</a>
  <span class="dot">&middot;</span>
  <a href="https://github.com/lastknownvoice">@lastknownvoice</a>
</footer>

</body>
</html>
