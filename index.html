<style>
  :root {
    --paper:      #faf9f6;
    --ink:        #171614;
    --ink-soft:   #767268;
    --accent:     #8a3324;

    --cell:       clamp(7px, 2.1vw, 10px);
    --gap:        clamp(3px, 0.85vw, 5px);

    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans:  ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #131211;
      --ink:      #ece8e0;
      --ink-soft: #8b867c;
      --accent:   #e08b74;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem 2rem;
    gap: clamp(1.75rem, 5vw, 2.75rem);
  }

  /* ---------- the mark ---------- */

  .mark {
    display: grid;
    grid-template-columns: repeat(7, var(--cell));
    grid-auto-rows: var(--cell);
    gap: var(--gap);
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .mark i {
    display: block;
    background: var(--accent);
    border-radius: 1px;
    opacity: var(--o);
    transform: scale(1);
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 2.1s cubic-bezier(.45, 0, .55, 1) infinite;
    animation-delay: calc(var(--d) * 135ms);
  }

  @keyframes pulse {
    0%   { opacity: var(--o);   transform: scale(1); }
    12%  { opacity: 1;          transform: scale(1.22); }
    38%  { opacity: calc(var(--o) * .55); transform: scale(.94); }
    100% { opacity: var(--o);   transform: scale(1); }
  }

  /* ---------- the name ---------- */

  h1 {
    margin: 0;
    font-size: clamp(2.1rem, 1rem + 7vw, 4.6rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.022em;
    text-wrap: balance;
  }
  h1 .tld { color: var(--accent); }

  /* ---------- the standfirst ---------- */

  .standfirst {
    margin: 0;
    max-width: 26rem;
    font-size: clamp(1rem, .95rem + .35vw, 1.125rem);
    line-height: 1.55;
    color: var(--ink-soft);
    text-wrap: balance;
  }

  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  /* ---------- footer ---------- */

  footer {
    display: flex;
    justify-content: center;
    gap: .35rem 1.4rem;
    flex-wrap: wrap;
    padding: 1.5rem 1.5rem 2.25rem;
    font-family: var(--sans);
    font-size: .8125rem;
    color: var(--ink-soft);
  }
  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color 160ms ease, border-color 160ms ease;
  }
  footer a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  footer .dot { color: var(--ink-soft); opacity: .5; }

  @media (prefers-reduced-motion: reduce) {
    .mark i { animation: none; opacity: var(--o); }
    * { transition: none !important; }
  }
</style>
