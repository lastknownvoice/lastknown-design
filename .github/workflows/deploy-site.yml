name: deploy-site

# The one-pager is a single static file. Every push to main redeploys it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          # The wordmark's typeface is self-hosted, so the font files
          # have to ship with the page or the site falls back to the
          # system monospace.
          cp -r fonts _site/fonts
          # .nojekyll stops Pages running the output through Jekyll.
          touch _site/.nojekyll
          ls -la _site/
          ls -la _site/fonts/

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
